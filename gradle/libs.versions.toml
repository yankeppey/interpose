[versions]
interpose = "0.1.0"

agp = "9.4.1"
vanniktechMavenPublish = "0.37.0"

# The *floor*, not a pin. A plain Gradle version is a minimum, so a consumer on a newer
# okhttp resolves up and Interpose compiles and runs against theirs — which matters,
# because Gradle's consistent resolution pins the androidTest classpath to whatever the
# app under test already uses.
#
# 4.6.0 is measured, not guessed: it is the oldest release this compiles against.
# 4.3.0–4.5.0 lack `okhttp3.internal.http1.HeadersReader` and an `operator get` on
# `Headers`; below 4.3.0 there is no `okhttp3.internal.concurrent.TaskRunner` either,
# which the HTTP/2 codec needs. Separately, 4.0.0–4.1.x crash at runtime on modern
# Android inside their own `AndroidPlatform.buildIfSupported` ("Expected Android API
# level 21+ but was 36"), so the runtime floor would have excluded them anyway.
okhttp = "4.6.0"

# Both compileOnly, so Interpose imposes no version on a consumer. Any project running
# instrumented tests already has the test runner; androidx.webkit is only needed to
# capture WebView traffic, and an app without a WebView should not have to carry it.
androidxTestRunner = "1.7.0"
androidxWebkit = "1.16.0"

androidxTestJunit = "1.3.0"
junit = "4.13.2"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
